<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | AI StudyLab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/study-tools.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="login.html" style="display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem;">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #8B5CF6, #6D28D9); display: inline-flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 4px 14px rgba(139, 92, 246, 0.45);">
          <i class="fa-solid fa-graduation-cap"></i>
        </span>
        <span>AI <span style="color: var(--primary-light);">StudyLab</span></span>
      </a>
      <h1 style="font-size: 1.35rem; font-weight: 700; margin-top: 16px;">Create your StudyLab</h1>
      <p style="font-size: 0.86rem; color: var(--text-secondary); margin-top: 4px;">Turn PDFs, slides, and notes into instant exam prep</p>
    </div>

    <form id="signup-form">
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input type="text" id="signup-name" class="input-control" style="width: 100%;" placeholder="Alex Morgan" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address</label>
        <input type="email" id="signup-email" class="input-control" style="width: 100%;" placeholder="alex@university.edu" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-major">Major / Field of Study</label>
        <input type="text" id="signup-major" class="input-control" style="width: 100%;" placeholder="Computer Science" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <input type="password" id="signup-password" class="input-control" style="width: 100%;" placeholder="Create a password" required />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px; padding: 10px;">
        <i class="fa-solid fa-sparkles"></i> Launch My Workspace
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary);">
      Already have an account? <a href="login.html" style="color: var(--primary-light); font-weight: 600;">Sign in</a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
