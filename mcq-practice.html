<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCQ Practice | AI StudyLab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/study-tools.css" />
</head>
<body>
  <header id="app-navbar"></header>

  <main class="page-wrapper">
    <div class="container">
      <section class="tool-header">
        <div>
          <h1 class="page-title">MCQ Practice Studio</h1>
          <p class="page-subtitle">Test your knowledge with AI-generated multiple choice quizzes and instant explanations.</p>
        </div>

        <div class="tool-doc-selector-wrap">
          <select id="mcq-doc-select" class="select-control" aria-label="Select Quiz Source"></select>
          <button type="button" id="generate-mcqs-btn" class="btn btn-purple-soft btn-sm">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate MCQs
          </button>
          <button type="button" id="restart-quiz-btn" class="btn btn-secondary btn-sm">
            <i class="fa-solid fa-rotate-right"></i> Restart Quiz
          </button>
        </div>
      </section>

      <div class="mcq-container">
        <!-- Quiz Card -->
        <div class="card" id="mcq-quiz-card">
          <div class="mcq-progress-header">
            <span id="mcq-q-counter">Question 1 of 3</span>
            <div style="display: flex; align-items: center; gap: 14px;">
              <span class="badge badge-success" id="mcq-score-pill">Score: 0</span>
              <span style="color: var(--primary-light); font-weight: 600;">
                <i class="fa-regular fa-clock"></i> <span id="mcq-timer">00:00</span>
              </span>
            </div>
          </div>

          <div class="progress-bar-track" style="margin-bottom: 20px;">
            <div class="progress-bar-fill" id="mcq-progress-bar"></div>
          </div>

          <h2 id="mcq-question-text" style="font-size: 1.12rem; font-weight: 600; line-height: 1.45; margin-bottom: 18px;"></h2>

          <div id="mcq-options-list"></div>

          <div id="mcq-explanation-box" class="mcq-explanation" style="display: none;">
            <strong style="color: var(--primary-light); display: block; margin-bottom: 4px;">
              <i class="fa-solid fa-lightbulb"></i> AI Explanation
            </strong>
            <span id="mcq-explanation-text"></span>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: 18px;">
            <button type="button" id="mcq-next-btn" class="btn btn-primary" disabled>
              Next Question <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- Quiz Complete Summary Card -->
        <div class="card" id="mcq-result-card" style="display: none; text-align: center; padding: 36px 24px;">
          <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--primary-subtle); color: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 14px; border: 1px solid rgba(139, 92, 246, 0.35);">
            <i class="fa-solid fa-trophy"></i>
          </div>
          <h2 style="font-size: 1.4rem; font-weight: 700;">Quiz Complete!</h2>
          <p id="mcq-final-subtitle" style="color: var(--text-secondary); margin-top: 6px; margin-bottom: 22px;"></p>

          <div style="display: flex; justify-content: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
            <div style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 22px;">
              <div style="font-size: 0.78rem; color: var(--text-muted);">Accuracy</div>
              <div id="mcq-final-pct" style="font-size: 1.6rem; font-weight: 700; color: var(--success);">0%</div>
            </div>
            <div style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 22px;">
              <div style="font-size: 0.78rem; color: var(--text-muted);">Correct</div>
              <div id="mcq-final-score" style="font-size: 1.6rem; font-weight: 700; color: var(--primary-light);">0 / 0</div>
            </div>
            <div style="background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px 22px;">
              <div style="font-size: 0.78rem; color: var(--text-muted);">Time Taken</div>
              <div id="mcq-final-time" style="font-size: 1.6rem; font-weight: 700; color: var(--text-main);">00:00</div>
            </div>
          </div>

          <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <button type="button" id="retake-quiz-btn" class="btn btn-primary">
              <i class="fa-solid fa-rotate-right"></i> Retake Quiz
            </button>
            <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
          </div>

          <div id="mcq-review-list" style="text-align: left; margin-top: 24px; display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- Previous Quiz History -->
        <div class="card" id="mcq-history-card" style="margin-top: 20px;">
          <h3 class="section-heading" style="margin-bottom: 12px;">
            <i class="fa-solid fa-clock-rotate-left" style="color: var(--primary-light);"></i>
            Previous Quiz Results
          </h3>
          <div id="mcq-history-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/mcq.js"></script>
</body>
</html>
