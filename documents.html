<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Document Library | AI StudyLab</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/documents.css" />
</head>
<body>
  <!-- Shared Horizontal Navbar -->
  <header id="app-navbar"></header>

  <main class="page-wrapper">
    <div class="container">
      <!-- Page Header -->
      <section class="library-header">
        <div>
          <div class="library-title-row">
            <h1 class="page-title">My Document Library</h1>
            <span class="badge badge-purple" id="doc-count-badge">0 Documents</span>
          </div>
          <p class="page-subtitle">Manage, filter, and launch AI-generated study tools across your uploaded course materials.</p>
        </div>

        <a href="upload.html" class="btn btn-primary">
          <i class="fa-solid fa-cloud-arrow-up"></i>
          <span>Upload New Document</span>
        </a>
      </section>

      <!-- Search & Subject Filter Toolbar -->
      <section class="library-toolbar">
        <div class="toolbar-left">
          <div class="search-field-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="doc-search-input"
              class="input-control"
              placeholder="Search by filename or topic..."
              aria-label="Search document library"
            />
          </div>

          <select id="subject-filter" class="select-control filter-select" aria-label="Filter by Subject">
            <option value="ALL">All Subjects</option>
          </select>

          <select id="format-filter" class="select-control filter-select" style="min-width: 130px;" aria-label="Filter by Format">
            <option value="ALL">All Formats</option>
            <option value="PDF">PDF Only</option>
            <option value="DOCX">DOCX Only</option>
            <option value="PPTX">PPTX Only</option>
          </select>
        </div>

        <div class="toolbar-right">
          <span id="showing-count-label">Showing 6 of 6</span>
          <button type="button" id="clear-filters-btn" class="btn btn-ghost btn-xs" style="display: none;">
            <i class="fa-solid fa-xmark"></i> Reset
          </button>
        </div>
      </section>

      <!-- Compact Responsive Document Table -->
      <section class="table-card">
        <div class="table-responsive">
          <table class="docs-table" aria-label="Uploaded Student Documents">
            <thead>
              <tr>
                <th>Format</th>
                <th>Document Filename</th>
                <th>Subject</th>
                <th>Size &amp; Items</th>
                <th>AI Status</th>
                <th>Study Actions</th>
              </tr>
            </thead>
            <tbody id="documents-table-body">
              <!-- Populated dynamically by js/documents.js -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/documents.js"></script>
</body>
</html>
